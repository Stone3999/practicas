<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <meta name="theme-color" content="#ffffff" />
  
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data:;
      media-src 'self';
      connect-src 'self';
    " />
  
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  
  <title>OmniRack — Monitor de Data Center</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  
  <!-- fondo -->
  <div id="videoContainer" class="video-container fallback-bg">
    <video id="bgVideo" autoplay loop muted preload="none"></video>
  </div>
  
  <!-- ui -->
  <div class="main-overlay">
    <div class="giant-white-card">
      <div class="header">
        <button id="btnCloseApp" class="close-btn focusable" tabindex="-1"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='black'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'/></svg>" width="40" height="40" alt="X"/></button>
        <span class="header-title">OmniRack</span>
        <span class="header-time" id="clock">12:00</span>
      </div>
      
      <div class="carousel-viewport">
        <div class="carousel-track" id="carouselTrack">
          <!-- Data Center A -->
          <div class="dc-slide focusable focused" id="dcA" data-dc="A" tabindex="0">
            <div class="slide-header">Data Center A</div>
            <div class="chart-container">
              <!-- 6 Racks -->
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-A-0" style="height: 0%"></div><span class="bar-label">R1</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-A-1" style="height: 0%"></div><span class="bar-label">R2</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-A-2" style="height: 0%"></div><span class="bar-label">R3</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-A-3" style="height: 0%"></div><span class="bar-label">R4</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-A-4" style="height: 0%"></div><span class="bar-label">R5</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-A-5" style="height: 0%"></div><span class="bar-label">R6</span></div>
            </div>
            <div class="slide-stats">
              <span id="tempA">--°C</span>
              <span id="statusA" class="status-ok">Estable</span>
            </div>
            <button class="slide-cctv-btn focusable" id="cctvA" tabindex="-1">Ver CCTV</button>
          </div>

          <!-- Data Center B -->
          <div class="dc-slide focusable" id="dcB" data-dc="B" tabindex="-1">
            <div class="slide-header">Data Center B</div>
            <div class="chart-container">
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-B-0" style="height: 0%"></div><span class="bar-label">R1</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-B-1" style="height: 0%"></div><span class="bar-label">R2</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-B-2" style="height: 0%"></div><span class="bar-label">R3</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-B-3" style="height: 0%"></div><span class="bar-label">R4</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-B-4" style="height: 0%"></div><span class="bar-label">R5</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-B-5" style="height: 0%"></div><span class="bar-label">R6</span></div>
            </div>
            <div class="slide-stats">
              <span id="tempB">--°C</span>
              <span id="statusB" class="status-ok">✔️ Estable</span>
            </div>
            <button class="slide-cctv-btn focusable" id="cctvB" tabindex="-1">👁️ Ver CCTV</button>
          </div>

          <!-- Data Center C -->
          <div class="dc-slide focusable" id="dcC" data-dc="C" tabindex="-1">
            <div class="slide-header">Data Center C</div>
            <div class="chart-container">
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-C-0" style="height: 0%"></div><span class="bar-label">R1</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-C-1" style="height: 0%"></div><span class="bar-label">R2</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-C-2" style="height: 0%"></div><span class="bar-label">R3</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-C-3" style="height: 0%"></div><span class="bar-label">R4</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-C-4" style="height: 0%"></div><span class="bar-label">R5</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-C-5" style="height: 0%"></div><span class="bar-label">R6</span></div>
            </div>
            <div class="slide-stats">
              <span id="tempC">--°C</span>
              <span id="statusC" class="status-ok">✔️ Estable</span>
            </div>
            <button class="slide-cctv-btn focusable" id="cctvC" tabindex="-1">👁️ Ver CCTV</button>
          </div>

          <!-- Data Center D -->
          <div class="dc-slide focusable" id="dcD" data-dc="D" tabindex="-1">
            <div class="slide-header">Data Center D</div>
            <div class="chart-container">
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-D-0" style="height: 0%"></div><span class="bar-label">R1</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-D-1" style="height: 0%"></div><span class="bar-label">R2</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-D-2" style="height: 0%"></div><span class="bar-label">R3</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-D-3" style="height: 0%"></div><span class="bar-label">R4</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-D-4" style="height: 0%"></div><span class="bar-label">R5</span></div>
              <div class="chart-bar-wrapper"><div class="chart-bar" id="bar-D-5" style="height: 0%"></div><span class="bar-label">R6</span></div>
            </div>
            <div class="slide-stats">
              <span id="tempD">--°C</span>
              <span id="statusD" class="status-ok">✔️ Estable</span>
            </div>
            <button class="slide-cctv-btn focusable" id="cctvD" tabindex="-1">👁️ Ver CCTV</button>
          </div>
        </div>
      </div>

      <div class="dpad-hint-global">
        <span>⬅️ ➡️ Mover</span>
        <span>⬇️ Bajar a CCTV</span>
        <span>OK Seleccionar</span>
      </div>
    </div> <!-- /giant-white-card -->
  </div> <!-- /main-overlay -->

  <div id="cctvModal" class="hidden">
    <video id="cctvVideo" autoplay loop muted preload="none"></video>
  </div>
  <div id="splashScreen" class="splash-screen">
    <h1>Cargando OmniRack...</h1>
  </div>

  <script src="/js/sse-client.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
